<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вступна кампанія — КПІ ім. Ігоря Сікорського</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --shell:#1c396e; --shell-ink:#f2f5fa; --shell-line:#2e4d86;
  --canvas:#eef1f4; --card:#ffffff; --card-line:#e0e5ea;
  --ink:#151a21; --ink2:#5b6675; --ink3:#8b95a3;
  --brand:#1c396e; --brand-2:#5a86c4; --brand-soft:#e6ecf6;
  --teal:#0f7b78; --amber:#b0761a; --red:#b3261e; --green:#2b7a55;
  --grid:#e8ecf0; --sel:#00539f; --focus:#ff8c1a;
  --r:3px;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;
  font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  font-size:13px;line-height:1.45;color:var(--ink);background:var(--canvas);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- App chrome ---------- */
.app{display:flex;flex-direction:column;min-height:100%}
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:calc(9px + env(safe-area-inset-top,0px)) 16px 9px;
  background:var(--shell);color:var(--shell-ink);
  border-bottom:1px solid var(--shell-line);
}
.topbar .mark{display:flex;align-items:center;gap:9px;min-width:0}
.mark svg{flex:none}
.mark .logo{flex:none;display:block;height:26px;width:auto}
.mark b{font-weight:600;font-size:13px;letter-spacing:.01em}
.mark span{color:#aebfd9;font-size:11.5px}
.spacer{flex:1 1 auto}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 9px;border:1px solid var(--shell-line);border-radius:var(--r);
  background:#26467e;color:var(--shell-ink);font-size:11.5px;white-space:nowrap;
}
.chip:hover{border-color:#5a86c4}
.chip.warn{border-color:#7a5a1d;background:#3a2f18;color:#f0c675}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.chip.warn .dot{background:#e0a437}
.rolebox{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#aebfd9}
select.role{
  appearance:none;background:#26467e url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23aebfd9'/></svg>") no-repeat right 8px center;
  color:var(--shell-ink);border:1px solid var(--shell-line);border-radius:var(--r);
  padding:5px 26px 5px 9px;font-size:11.5px;max-width:260px;
}

/* ---------- Ribbon: pages + slicers ---------- */
.ribbon{background:var(--card);border-bottom:1px solid var(--card-line)}
.pages{display:flex;gap:2px;padding:0 12px;overflow-x:auto;border-bottom:1px solid var(--card-line)}
.page-tab{
  padding:9px 13px;font-size:12.5px;color:var(--ink2);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.page-tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.page-tab:hover{color:var(--ink)}

.slicers{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:9px 14px}
.sl{display:flex;flex-direction:column;gap:3px;min-width:0}
.sl label{font-size:10.5px;color:var(--ink3);letter-spacing:.01em}
.sl select,.sl input{
  appearance:none;background:var(--card);color:var(--ink);
  border:1px solid var(--card-line);border-radius:var(--r);
  padding:5px 8px;font-size:12px;min-width:130px;max-width:200px;
}
.sl select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238b95a3'/></svg>");background-repeat:no-repeat;background-position:right 7px center;padding-right:24px}
.seg{display:flex;border:1px solid var(--card-line);border-radius:var(--r);overflow:hidden}
.seg button{padding:5px 11px;font-size:12px;color:var(--ink2);background:var(--card)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:600}
.clear{padding:5px 10px;font-size:12px;color:var(--brand);border:1px solid var(--card-line);border-radius:var(--r)}
.clear[disabled]{color:var(--ink3);cursor:default}

.xfilter{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 14px;background:var(--brand-soft);border-bottom:1px solid var(--card-line);
  font-size:11.5px;color:var(--ink);
}
.xfilter:empty{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:2px 4px 2px 9px}
.tag button{width:16px;height:16px;border-radius:50%;color:var(--ink2);line-height:1;font-size:13px}
.tag button:hover{background:var(--card-line)}

/* ---------- Report canvas ---------- */
.report{flex:1 1 auto;padding:12px;max-width:1480px;width:100%;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.card{
  background:var(--card);border:1px solid var(--card-line);border-radius:var(--r);
  padding:11px 12px 12px;min-width:0;display:flex;flex-direction:column;
}
.card>h3{
  margin:0 0 9px;font-size:12.5px;font-weight:600;color:var(--ink);
  display:flex;align-items:baseline;gap:8px;
}
.card>h3 em{font-style:normal;font-weight:400;font-size:11px;color:var(--ink3)}
.card .body{flex:1 1 auto;min-height:0}

/* KPI tiles */
.kpis{grid-column:span 12;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r);padding:10px 12px}
.kpi .k-lab{font-size:11px;color:var(--ink2);min-height:28px}
.kpi .k-val{font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1.15;margin-top:2px}
.kpi .k-sub{font-size:10.5px;color:var(--ink3);margin-top:3px}
.kpi.accent .k-val{color:var(--brand)}
.bar-mini{height:3px;background:var(--grid);border-radius:2px;margin-top:7px;overflow:hidden}
.bar-mini i{display:block;height:100%;background:var(--brand)}
.bar-mini i.over{background:var(--green)}
.bar-mini i.under{background:var(--amber)}

.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}
.c9{grid-column:span 9}.c12{grid-column:span 12}

svg.viz{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:inherit;fill:var(--ink2)}
.ax{font-size:10px;fill:var(--ink3)}
.vl{font-size:9.5px;fill:var(--ink2)}
.gridline{stroke:var(--grid);stroke-width:1}
.axisline{stroke:var(--card-line);stroke-width:1}
.hit{cursor:pointer}
.hit:hover rect.b,.hit:hover path.b{opacity:.82}
.dim{opacity:.26}
tr.dim td{opacity:.45}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:5px;vertical-align:-1px}

table.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
table.tbl th{
  text-align:left;font-weight:600;color:var(--ink2);font-size:10.5px;
  padding:5px 7px;border-bottom:1px solid var(--card-line);white-space:nowrap;
  position:sticky;top:0;background:var(--card);
}
table.tbl th.num,table.tbl td.num{text-align:right}
table.tbl td{padding:5px 7px;border-bottom:1px solid var(--grid)}
table.tbl tr:hover td{background:var(--brand-soft)}
.scroll{overflow:auto;max-height:340px}
.mx-wrap{overflow-x:auto;border:1px solid var(--card-line);border-radius:var(--r)}
table.mx{border-collapse:collapse;font-size:11px;width:100%;min-width:900px}
table.mx th,table.mx td{padding:3px 5px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--grid)}
table.mx thead th{position:sticky;top:0;background:var(--card);font-weight:600;color:var(--ink3);font-size:10px;padding:5px}
table.mx th.lh{text-align:left;font-weight:600;color:var(--ink2);position:sticky;left:0;background:var(--card);min-width:74px;z-index:1}
table.mx thead th.lh{z-index:2}
table.mx td.tt,table.mx th.tt{font-weight:600;color:var(--ink);background:var(--card);border-left:1px solid var(--card-line)}
table.mx tfoot th,table.mx tfoot td{font-weight:600;color:var(--ink2);border-top:1px solid var(--card-line);border-bottom:0}
table.mx tbody tr:hover td{outline:1px solid var(--brand);outline-offset:-1px}
table.mx tbody tr.hit{cursor:pointer}
table.mx th.dim,table.mx td.dim{opacity:.32}
table.mx tr.dim td.tt{opacity:.45}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;border:1px solid transparent}
.pill.ok{background:rgba(43,122,85,.12);color:var(--green);border-color:rgba(43,122,85,.3)}
.pill.no{background:rgba(179,38,30,.1);color:var(--red);border-color:rgba(179,38,30,.28)}
.pill.mid{background:rgba(176,118,26,.12);color:var(--amber);border-color:rgba(176,118,26,.3)}
.pill.n{background:var(--grid);color:var(--ink2)}
.mask{color:var(--ink3);letter-spacing:.06em}

.note{font-size:11px;color:var(--ink3);margin-top:8px;line-height:1.5}
.empty{padding:26px 10px;text-align:center;color:var(--ink3);font-size:12px}

/* RLS banner */
.rls{
  display:flex;align-items:flex-start;gap:9px;grid-column:span 12;
  background:var(--card);border:1px solid var(--card-line);border-left:3px solid var(--teal);
  border-radius:var(--r);padding:9px 12px;font-size:11.5px;color:var(--ink2);
}
.rls b{color:var(--ink);font-weight:600}

/* Drawer */
.drawer-bg{
  position:fixed;inset:0;background:rgba(28,57,110,.35);
  display:none;z-index:40;
}
.drawer-bg[data-open]{display:block}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);
  background:var(--card);border-left:1px solid var(--card-line);
  z-index:41;transform:translateX(100%);transition:transform .22s ease;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer[data-open]{transform:none}
.drawer header{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--card-line);
}
.drawer header h2{margin:0;font-size:14px;font-weight:600}
.drawer .inner{padding:14px 16px 24px;overflow:auto}
.dq{border:1px solid var(--card-line);border-radius:var(--r);padding:10px 12px;margin-bottom:9px}
.dq h4{margin:0 0 5px;font-size:12px;font-weight:600;display:flex;gap:7px;align-items:center}
.dq p{margin:0;font-size:11.5px;color:var(--ink2);line-height:1.55}
.dq .nums{display:flex;gap:14px;margin:7px 0 4px;font-size:11.5px}
.dq .nums div{border-left:2px solid var(--card-line);padding-left:8px}
.dq .nums b{display:block;font-size:16px;font-weight:600}
.dq .nums .a b{color:var(--amber)}
.dq .nums .c b{color:var(--red)}
.sev{width:7px;height:7px;border-radius:50%;flex:none}
.sev.h{background:var(--red)}.sev.m{background:var(--amber)}.sev.l{background:var(--ink3)}
.close{width:28px;height:28px;border-radius:var(--r);color:var(--ink2);font-size:18px;line-height:1}
.close:hover{background:var(--grid)}

.footer{
  max-width:1480px;width:100%;margin:0 auto;padding:4px 14px 20px;
  font-size:10.5px;color:var(--ink3);line-height:1.6;
}
.footer b{color:var(--ink2);font-weight:600}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .c3,.c4,.c5{grid-column:span 6}
  .c7,.c8,.c9{grid-column:span 12}
}
@media (max-width:720px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .c3,.c4,.c5,.c6,.c7,.c8,.c9{grid-column:span 12}
  .report{padding:8px}
  .kpi .k-val{font-size:21px}
}
</style>
</head>

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function dayLabel(iso){ var m=iso.split('-'); return m[2].replace(/^0/,'')+'.'+m[1]; }

/* ---------- Ядро: побудова маски рядків ---------- */
function rowMask(skip){
  var sk = skip==null?[]:(Array.isArray(skip)?skip:[skip]);
  skip = {has:function(k){return sk.indexOf(k)>=0;}};
  var mask = new Uint8Array(N);
  var rlsFac = role.fac ? dims.fac.indexOf(role.fac) : -2;
  var fFac  = (!skip.has('fac')    && F.fac)    ? dims.fac.indexOf(F.fac) : -2;
  var fSpec = (!skip.has('spec')   && F.spec)   ? dims.spec.indexOf(F.spec) : -2;
  var fSt   = (!skip.has('status') && F.status) ? dims.status.indexOf(F.status) : -2;
  var fFm   = (!skip.has('form')   && F.form)   ? dims.form.indexOf(F.form) : -2;
  var fUn   = (!skip.has('univ')   && F.univ)   ? dims.univ.indexOf(F.univ) : -2;
  var fPr   = (!skip.has('prior')  && F.prior)  ? +F.prior : -2;
  var fBk   = (!skip.has('bucket') && F.bucket!=='') ? +F.bucket : -2;
  var fFu   = F.fund==='all' ? -2 : (F.fund==='budget'?0:1);

  for(var i=0;i<N;i++){
    if(D.f[i] < 0) continue;                       /* сироти — лише в панелі якості */
    if(rlsFac!==-2 && D.f[i]!==rlsFac) continue;   /* RLS */
    if(fFac!==-2  && D.f[i]!==fFac)  continue;
    if(fSpec!==-2 && D.sp[i]!==fSpec) continue;
    if(fSt!==-2   && D.st[i]!==fSt)  continue;
    if(fFm!==-2   && D.fm[i]!==fFm)  continue;
    if(fUn!==-2   && D.un[i]!==fUn)  continue;
    if(fPr!==-2   && D.pr[i]!==fPr)  continue;
    if(fFu!==-2   && D.fu[i]!==fFu)  continue;
    if(fBk!==-2   && bucketOf(D.sc[i])!==fBk) continue;
    mask[i]=1;
  }
  return mask;
}

function agg(mask){
  var r={n:0,bud:0,con:0,order:0,orderBud:0,scoreSum:0,scoreN:0,uniq:new Set(),
         byFac:{},byStatus:{},byDate:{},byPrior:{},byBucket:{},bySpec:{},byUniv:{}};
  for(var i=0;i<N;i++){
    if(!mask[i]) continue;
    r.n++;
    if(D.fu[i]===0) r.bud++; else r.con++;
    var isOrder = dims.status[D.st[i]]==='До наказу';
    if(isOrder){ r.order++; if(D.fu[i]===0) r.orderBud++; }
    if(D.sc[i]>0){ r.scoreSum+=D.sc[i]; r.scoreN++; }
    r.uniq.add(D.ap[i]);
    var f=dims.fac[D.f[i]];
    var o=r.byFac[f]||(r.byFac[f]={n:0,bud:0,con:0,order:0});
    o.n++; if(D.fu[i]===0)o.bud++; else o.con++; if(isOrder)o.order++;
    var s=dims.status[D.st[i]]; r.byStatus[s]=(r.byStatus[s]||0)+1;
    var d=dims.date[D.dt[i]]; if(d) r.byDate[d]=(r.byDate[d]||0)+1;
    r.byPrior[D.pr[i]]=(r.byPrior[D.pr[i]]||0)+1;
    var b=bucketOf(D.sc[i]); if(b>=0) r.byBucket[b]=(r.byBucket[b]||0)+1;
    var sp=dims.spec[D.sp[i]];
    var so=r.bySpec[sp]||(r.bySpec[sp]={n:0,bud:0,order:0});
    so.n++; if(D.fu[i]===0)so.bud++; if(isOrder)so.order++;
    var u=dims.univ[D.un[i]]; if(u) r.byUniv[u]=(r.byUniv[u]||0)+1;
  }
  r.uniqN=r.uniq.size;
  r.avg = r.scoreN ? r.scoreSum/r.scoreN : null;
  return r;
}

/* обсяг / держзамовлення з урахуванням активної області видимості */
function scopeFaculties(){
  if(role.fac) return [role.fac];
  if(F.fac) return [F.fac];
  return dims.fac.slice();
}
function scopeObsyag(){
  return scopeFaculties().reduce(function(a,f){ return a+dims.obsyag[dims.fac.indexOf(f)]; },0);
}
function scopeDz(){
  return scopeFaculties().reduce(function(a,f){ return a+dims.dz[dims.fac.indexOf(f)]; },0);
}

/* ---------- SVG-хелпери ---------- */
function svg(w,h,inner){
  return '<svg class="viz" viewBox="0 0 '+w+' '+h+'" role="img" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';
}
function niceMax(v){
  if(v<=0) return 10;
  var e=Math.pow(10,Math.floor(Math.log10(v))), m=v/e;
  var s=[1,1.2,1.5,2,2.5,3,4,5,6,8,10].find(function(x){return m<=x;})||10;
  return s*e;
}

/* Горизонтальні згруповані смуги: бюджет + контракт */
function hBars(rows,opt){
  opt=opt||{};
  var W=opt.w||560, rowH=opt.rowH||19, gap=6, left=opt.left||96, right=52;
  var H = rows.length*(rowH+gap)+26;
  var max = niceMax(Math.max.apply(null,rows.map(function(r){return r.total;}).concat([1])));
  var sx = function(v){ return (W-left-right)*v/max; };
  var g='';
  for(var t=0;t<=4;t++){
    var x=left+sx(max*t/4);
    g+='<line class="gridline" x1="'+x+'" y1="14" x2="'+x+'" y2="'+(H-12)+'"/>'+
       '<text class="ax" x="'+x+'" y="10" text-anchor="middle">'+nf(max*t/4)+'</text>';
  }
  rows.forEach(function(r,i){
    var y=20+i*(rowH+gap);
    var dim = (opt.selKey && F[opt.selKey] && F[opt.selKey]!==r.key) ? ' dim' : '';
    g+='<g class="hit'+dim+'" data-filter="'+opt.selKey+'" data-value="'+esc(r.key)+'" tabindex="0" role="button">'+
       '<title>'+esc(r.label||r.key)+': '+nf(r.total)+' (бюджет '+nf(r.a)+', контракт '+nf(r.b)+')</title>'+
       '<text class="vl" x="'+(left-7)+'" y="'+(y+rowH/2+3)+'" text-anchor="end">'+esc(r.key)+'</text>'+
       '<rect class="b" x="'+left+'" y="'+y+'" width="'+Math.max(sx(r.a),0)+'" height="'+rowH+'" fill="var(--brand)"/>'+
       '<rect class="b" x="'+(left+sx(r.a))+'" y="'+y+'" width="'+Math.max(sx(r.b),0)+'" height="'+rowH+'" fill="var(--brand-2)"/>'+
       '<text class="vl" x="'+(left+sx(r.total)+6)+'" y="'+(y+rowH/2+3)+'">'+nf(r.total)+'</text>'+
       '<rect x="0" y="'+y+'" width="'+W+'" height="'+rowH+'" fill="transparent"/></g>';
  });
  g+='<line class="axisline" x1="'+left+'" y1="14" x2="'+left+'" y2="'+(H-12)+'"/>';
  return svg(W,H,g);
}

/* Комбо: до наказу (стовпчик) + % заповнення обсягу (лінія) */
function combo(rows,o){
  o=o||{};
  var W=o.w||660,H=o.h||210,left=44,right=46,top=16,bot=46;
  var maxB=niceMax(Math.max.apply(null,rows.map(function(r){return r.bars;}).concat([1])));
  var bw=(W-left-right)/rows.length;
  var g='';
  for(var t=0;t<=4;t++){
    var y=top+(H-top-bot)*(1-t/4);
    g+='<line class="gridline" x1="'+left+'" y1="'+y+'" x2="'+(W-right)+'" y2="'+y+'"/>'+
       '<text class="ax" x="'+(left-5)+'" y="'+(y+3)+'" text-anchor="end">'+nf(maxB*t/4)+'</text>'+
       '<text class="ax" x="'+(W-right+5)+'" y="'+(y+3)+'">'+Math.round(100*t/4)+'%</text>';
  }
  var pts=[];
  rows.forEach(function(r,i){
    var h=(H-top-bot)*r.bars/maxB, x=left+i*bw+bw*0.18, w=bw*0.64, y=H-bot-h;
    var dim=(F.fac && F.fac!==r.key)?' dim':'';
    g+='<g class="hit'+dim+'" data-filter="fac" data-value="'+esc(r.key)+'" tabindex="0" role="button">'+
       '<title>'+esc(r.key)+': до наказу '+nf(r.bars)+' з обсягу '+nf(r.cap)+' ('+pf(r.line)+')</title>'+
       '<rect class="b" x="'+x+'" y="'+y+'" width="'+w+'" height="'+Math.max(h,0)+'" fill="var(--brand)"/>'+
       '<rect x="'+(left+i*bw)+'" y="'+top+'" width="'+bw+'" height="'+(H-top-bot)+'" fill="transparent"/></g>';
    g+='<text class="ax" x="'+(left+i*bw+bw/2)+'" y="'+(H-bot+13)+'" text-anchor="middle" transform="rotate(-38 '+(left+i*bw+bw/2)+' '+(H-bot+13)+')">'+esc(r.key)+'</text>';
    pts.push([left+i*bw+bw/2, top+(H-top-bot)*(1-Math.min(r.line,100)/100)]);
  });
  g+='<polyline fill="none" stroke="var(--amber)" stroke-width="1.8" points="'+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+'"/>';
  pts.forEach(function(p){ g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="var(--card)" stroke="var(--amber)" stroke-width="1.6"/>'; });
  g+='<line class="axisline" x1="'+left+'" y1="'+(H-bot)+'" x2="'+(W-right)+'" y2="'+(H-bot)+'"/>';
  return svg(W,H,g);
}

/* Донат зі статусами */
function donut(entries,total){
  var W=250,H=200,cx=100,cy=98,R=72,r0=44;
  var COL=['#1c396e','#2b7a55','#b0761a','#5a86c4','#0f7b78','#8b95a3','#b3261e','#9cb6da','#ccd5e3','#5b6675'];
  var a0=-Math.PI/2,g='';
  entries.forEach(function(e,i){
    var frac=e[1]/total, a1=a0+frac*Math.PI*2;
    var large=frac>0.5?1:0;
    var p=['M',cx+R*Math.cos(a0),cy+R*Math.sin(a0),
           'A',R,R,0,large,1,cx+R*Math.cos(a1),cy+R*Math.sin(a1),
           'L',cx+r0*Math.cos(a1),cy+r0*Math.sin(a1),
           'A',r0,r0,0,large,0,cx+r0*Math.cos(a0),cy+r0*Math.sin(a0),'Z'].join(' ');
    var dim=(F.status && F.status!==e[0])?' dim':'';
    g+='<g class="hit'+dim+'" data-filter="status" data-value="'+esc(e[0])+'" tabindex="0" role="button">'+
       '<title>'+esc(e[0])+': '+nf(e[1])+' ('+pf(frac*100)+')</title>'+
       '<path class="b" d="'+p+'" fill="'+COL[i%COL.length]+'"/></g>';
    a0=a1;
  });
  g+='<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-size="19" font-weight="600" fill="var(--ink)">'+nf(total)+'</text>'+
     '<text class="ax" x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle">заяв</text>';
  return svg(W,H,g);
}

/* Лінія динаміки з накопиченням */
function timeline(byDate, ctxDate, o){
  o=o||{};
  var days=dims.date.filter(function(d){return d;});
  var vals=days.map(function(d){return byDate[d]||0;});
  var ctx=ctxDate?days.map(function(d){return ctxDate[d]||0;}):vals;
  var W=o.w||660,H=o.h||168,left=44,right=16,top=16,bot=o.allLabels?44:36;
  var max=niceMax(Math.max.apply(null,ctx.concat(vals).concat([1])));
  var bw=(W-left-right)/days.length;
  var g='';
  for(var t=0;t<=4;t++){
    var y=top+(H-top-bot)*(1-t/4);
    g+='<line class="gridline" x1="'+left+'" y1="'+y+'" x2="'+(W-right)+'" y2="'+y+'"/>'+
       '<text class="ax" x="'+(left-5)+'" y="'+(y+3)+'" text-anchor="end">'+nf(max*t/4)+'</text>';
  }
  var split = ctxDate && ctx.some(function(v,i){return v!==vals[i];});
  days.forEach(function(d,i){
    var h=(H-top-bot)*vals[i]/max, hc=(H-top-bot)*ctx[i]/max,
        x=left+i*bw+bw*0.16, w=Math.max(bw*0.68,1.5);
    var tip=d.split('-').reverse().join('.')+': '+nf(vals[i])+' заяв'+
      (split?' з '+nf(ctx[i])+' ('+pf(ctx[i]?vals[i]/ctx[i]*100:0)+')':'');
    g+='<g class="hit" tabindex="-1"><title>'+tip+'</title>';
    if(split) g+='<rect x="'+x+'" y="'+(H-bot-hc)+'" width="'+w+'" height="'+Math.max(hc,0)+'" fill="var(--brand-2)" opacity="0.22"/>';
    g+='<rect class="b" x="'+x+'" y="'+(H-bot-h)+'" width="'+w+'" height="'+Math.max(h,0)+'" fill="var(--brand-2)"/></g>';
    if(o.allLabels||i%3===0||i===days.length-1)
      g+='<text class="ax" x="'+(left+i*bw+bw/2)+'" y="'+(H-bot+14)+'" text-anchor="middle">'+dayLabel(d)+'</text>';
  });
  var peak=ctx.indexOf(Math.max.apply(null,ctx));
  if(ctx[peak]>0){
    var px=left+peak*bw+bw/2, py=H-bot-(H-top-bot)*ctx[peak]/max;
    g+='<line x1="'+px+'" y1="'+(py-4)+'" x2="'+px+'" y2="'+(top+2)+'" stroke="var(--amber)" stroke-width="1" stroke-dasharray="2 2"/>'+
       '<text class="vl" x="'+px+'" y="'+(top-1)+'" text-anchor="middle" fill="var(--amber)">пік '+nf(vals[peak])+' · '+dayLabel(days[peak])+'</text>';
  }
  g+='<line class="axisline" x1="'+left+'" y1="'+(H-bot)+'" x2="'+(W-right)+'" y2="'+(H-bot)+'"/>';
  return svg(W,H,g);
}

function dayMatrix(){
  var mask=rowMask('fac'), days=dims.date.filter(function(d){return d;});
  var di={}; days.forEach(function(d,i){di[d]=i;});
  var m={}, mx=0;
  for(var i=0;i<N;i++){
    if(!mask[i]) continue;
    var d=dims.date[D.dt[i]]; if(!d) continue;
    var f=dims.fac[D.f[i]];
    var row=m[f]||(m[f]={a:new Array(days.length).fill(0),t:0});
    row.a[di[d]]++; row.t++;
    if(row.a[di[d]]>mx) mx=row.a[di[d]];
  }
  var facs=Object.keys(m).sort(function(x,y){return m[y].t-m[x].t;});
  if(!facs.length) return '<div class="empty">Немає даних за поточними фільтрами</div>';
  var tot=days.map(function(_,i){return facs.reduce(function(s,f){return s+m[f].a[i];},0);});
  var grand=facs.reduce(function(s,f){return s+m[f].t;},0);

  var h='<div class="mx-wrap"><table class="mx"><thead><tr><th class="lh">Підрозділ</th>'+
    days.map(function(d){return '<th>'+dayLabel(d)+'</th>';}).join('')+'<th class="tt">Усього</th></tr></thead><tbody>';
  facs.forEach(function(f){
    var dim=(F.fac&&F.fac!==f)?' dim':'';
    h+='<tr class="hit'+dim+'" data-filter="fac" data-value="'+esc(f)+'" tabindex="0"><th class="lh">'+esc(f)+'</th>'+
      m[f].a.map(function(v){
        var o=v? (0.10+0.72*Math.sqrt(v/mx)) : 0;
        return '<td'+(v?' style="background:rgba(28,57,110,'+o.toFixed(2)+');color:'+(o>0.5?'#fff':'inherit')+'"':'')+'>'+(v||'')+'</td>';
      }).join('')+'<td class="tt">'+nf(m[f].t)+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><th class="lh">Усього</th>'+
    tot.map(function(v){return '<td>'+nf(v)+'</td>';}).join('')+'<td class="tt">'+nf(grand)+'</td></tr></tfoot></table></div>';
  return h;
}

function univFacMatrix(){
  var mask=rowMask(['univ','fac']);
  var m={}, mx=0, colT={}, grand=0;
  for(var i=0;i<N;i++){
    if(!mask[i]) continue;
    var u=dims.univ[D.un[i]], f=dims.fac[D.f[i]];
    if(!u) continue;
    var row=m[u]||(m[u]={c:{},t:0});
    row.c[f]=(row.c[f]||0)+1; row.t++;
    colT[f]=(colT[f]||0)+1; grand++;
    if(row.c[f]>mx) mx=row.c[f];
  }
  var univs=Object.keys(m).sort(function(x,y){return m[y].t-m[x].t;});
  var facs=dims.fac.slice().sort(function(x,y){return (colT[y]||0)-(colT[x]||0);});
  if(!univs.length) return '<div class="empty">Немає даних за поточними фільтрами</div>';

  var h='<div class="mx-wrap"><table class="mx"><thead><tr><th class="lh" style="min-width:190px">Заклад вищої освіти</th>'+
    facs.map(function(f){
      var dim=(F.fac&&F.fac!==f)?' class="dim"':'';
      return '<th'+dim+'>'+esc(f)+'</th>';
    }).join('')+'<th class="tt">Усього</th></tr></thead><tbody>';
  univs.forEach(function(u){
    var dimR=(F.univ&&F.univ!==u)?' dim':'';
    h+='<tr class="hit'+dimR+'" data-filter="univ" data-value="'+esc(u)+'" tabindex="0">'+
       '<th class="lh" style="min-width:190px" title="'+esc(u)+'">'+esc(u.length>34?u.slice(0,32)+'…':u)+'</th>'+
      facs.map(function(f){
        var v=m[u].c[f]||0;
        var o=v? (0.10+0.72*Math.sqrt(v/mx)) : 0;
        var dimC=(F.fac&&F.fac!==f)?' dim':'';
        return '<td class="'+dimC.trim()+'"'+(v?' style="background:rgba(28,57,110,'+o.toFixed(2)+');color:'+(o>0.5?'#fff':'inherit')+'"':'')+'>'+(v||'')+'</td>';
      }).join('')+'<td class="tt">'+nf(m[u].t)+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><th class="lh" style="min-width:190px">Усього</th>'+
    facs.map(function(f){return '<td>'+nf(colT[f]||0)+'</td>';}).join('')+
    '<td class="tt">'+nf(grand)+'</td></tr></tfoot></table></div>';
  return h;
}

/* ---------- Рендер сторінок ---------- */
function kpiTile(lab,val,sub,cls,bar){
  return '<div class="kpi '+(cls||'')+'"><div class="k-lab">'+lab+'</div>'+
    '<div class="k-val">'+val+'</div><div class="k-sub">'+(sub||'&nbsp;')+'</div>'+
    (bar||'')+'</div>';
}

function renderOverview(A){
  /* cross-highlight: візуал не фільтрує сам себе — інші категорії лишаються видимими, але пригашеними */
  var Afac = agg(rowMask('fac'));
  var Ast  = agg(rowMask('status'));
  var obs=scopeObsyag(), dz=scopeDz();
  var fillDz = dz? A.orderBud/dz*100 : null;
  var fillObs = obs? A.order/obs*100 : null;
  var konk = dz? A.bud/dz : null;

  var kpis='<div class="kpis">'+
    kpiTile('Загальна кількість заяв', nf(A.n),
      'бюджет '+nf(A.bud)+' · контракт '+nf(A.con),'accent') +
    kpiTile('Унікальних вступників', nf(A.uniqN),
      A.uniqN? rf(A.n/A.uniqN)+' заяви на вступника':'') +
    kpiTile('Зараховано до наказу', nf(A.order),
      'бюджет '+nf(A.orderBud)+' · контракт '+nf(A.order-A.orderBud)) +
    kpiTile('Виконання держзамовлення', pf(fillDz,1),
      nf(A.orderBud)+' з '+nf(dz)+' місць','',
      '<div class="bar-mini"><i class="'+(fillDz>=95?'over':'under')+'" style="width:'+Math.min(fillDz||0,100)+'%"></i></div>') +
    kpiTile('Заповнення ліцензійного обсягу', pf(fillObs,1),
      nf(A.order)+' з '+nf(obs)+' місць','',
      '<div class="bar-mini"><i class="'+(fillObs>=60?'over':'under')+'" style="width:'+Math.min(fillObs||0,100)+'%"></i></div>') +
    kpiTile('Середній конкурсний бал', A.avg?rf(A.avg):'—',
      'конкурс '+rf(konk)+' заяви на бюджетне місце') +
  '</div>';

  var facRows = Object.keys(Afac.byFac).map(function(f){
    var o=Afac.byFac[f];
    return {key:f,label:dims.facFull[dims.fac.indexOf(f)],a:o.bud,b:o.con,total:o.n};
  }).sort(function(a,b){return b.total-a.total;});

  var comboRows = facRows.map(function(r){
    var cap=dims.obsyag[dims.fac.indexOf(r.key)];
    return {key:r.key,bars:Afac.byFac[r.key].order,cap:cap,line:cap?Afac.byFac[r.key].order/cap*100:0};
  });

  var statusEntries = Object.keys(Ast.byStatus).map(function(k){return [k,Ast.byStatus[k]];})
    .sort(function(a,b){return b[1]-a[1];});

  return kpis +
  (role.fac||!role.pii ? '<div class="rls"><svg width="15" height="15" viewBox="0 0 16 16" style="flex:none;margin-top:1px"><path d="M8 1.5l5 2v4c0 3.2-2.1 5.7-5 7-2.9-1.3-5-3.8-5-7v-4l5-2z" fill="none" stroke="var(--teal)" stroke-width="1.4"/><path d="M5.6 8.1l1.7 1.7 3.1-3.4" fill="none" stroke="var(--teal)" stroke-width="1.4"/></svg><div><b>'+esc(role.name)+'</b> — '+esc(role.note)+'</div></div>' : '') +
  '<div class="card c7"><h3>Заяви за структурними підрозділами <em>бюджет і контракт · клік фільтрує звіт</em></h3>'+
    '<div class="body">'+(facRows.length?hBars(facRows,{selKey:'fac',w:600}):'<div class="empty">Немає даних за поточними фільтрами</div>')+'</div>'+
    '<div class="legend"><span><i style="background:var(--brand)"></i>Бюджет</span><span><i style="background:var(--brand-2)"></i>Контракт</span></div></div>'+

  '<div class="card c5"><h3>Структура статусів заявок</h3>'+
    '<div class="body">'+(Ast.n?donut(statusEntries,Ast.n):'<div class="empty">Немає даних</div>')+'</div>'+
    '<div class="legend">'+statusEntries.slice(0,5).map(function(e,i){
      var COL=['#1c396e','#2b7a55','#b0761a','#5a86c4','#0f7b78'];
      return '<span><i style="background:'+COL[i]+'"></i>'+esc(e[0])+' — '+pf(e[1]/Ast.n*100)+'</span>';
    }).join('')+'</div></div>'+

  '<div class="card c12"><h3>Заповнення ліцензійного обсягу <em>стовпчики — до наказу, лінія — % обсягу</em></h3>'+
    '<div class="body">'+(comboRows.length?combo(comboRows,{w:1340,h:250}):'<div class="empty">Немає даних</div>')+'</div>'+
    '<div class="legend"><span><i style="background:var(--brand)"></i>Зараховано до наказу</span><span><i style="background:var(--amber)"></i>% ліцензійного обсягу</span></div></div>'+

  '<div class="card c12"><h3>Динаміка подання заяв <em>8 серпня — 25 вересня 2025 · деталізація за підрозділами</em></h3>'+
    '<div class="body">'+(A.n?timeline(A.byDate, Afac.byDate, {w:1340,h:250,allLabels:true}):'<div class="empty">Немає даних</div>')+'</div>'+
    (F.fac||role.fac
      ? '<div class="legend"><span><i style="background:var(--brand-2)"></i>'+esc(F.fac||role.fac)+'</span>'+
        '<span><i style="background:var(--brand-2);opacity:.22"></i>Усі підрозділи</span></div>'
      : '')+
    '<div style="margin-top:10px">'+dayMatrix()+'</div>'+
    '<p class="note">Друга хвиля у вересні — додатковий набір на контракт. Інтенсивність заливки — кількість заяв за день; клік по рядку фільтрує звіт.</p></div>';
}

function renderCompete(A){
  var Asp=agg(rowMask('spec')), Abk=agg(rowMask('bucket')),
      Apr=agg(rowMask('prior')), Aun=agg(rowMask('univ'));
  var specRows=Object.keys(Asp.bySpec).map(function(s){
    var o=Asp.bySpec[s], i=dims.spec.indexOf(s);
    return {key:s,label:dims.specName[i],a:o.bud,b:o.n-o.bud,total:o.n};
  }).sort(function(a,b){return b.total-a.total;}).slice(0,15);

  var bkRows=BUCKETS.map(function(b,i){return {key:i,label:b.replace('–','-'),v:Abk.byBucket[i]||0};});
  var prRows=[1,2,3,4,5,6,7].map(function(p){return {key:p,label:String(p),v:Apr.byPrior[p]||0};});
  var unRows=Object.keys(Aun.byUniv).map(function(u){return [u,Aun.byUniv[u]];})
    .sort(function(a,b){return b[1]-a[1];}).slice(0,8);
  var unMax=unRows.length?unRows[0][1]:1;

  var Amx=agg(rowMask('fac'));
  var matrixFac=Object.keys(Amx.byFac).sort(function(a,b){return Amx.byFac[b].n-Amx.byFac[a].n;}).slice(0,12);
  var topStatus=Object.keys(A.byStatus).sort(function(a,b){return A.byStatus[b]-A.byStatus[a];}).slice(0,5);

  return '<div class="card c7"><h3>Конкурс за спеціальностями <em>топ-15 за кількістю заяв</em></h3>'+
    '<div class="body">'+(specRows.length?hBars(specRows,{selKey:'spec',w:600,left:56,rowH:17}):'<div class="empty">Немає даних</div>')+'</div>'+
    '<div class="legend"><span><i style="background:var(--brand)"></i>Бюджет</span><span><i style="background:var(--brand-2)"></i>Контракт</span></div></div>'+

  '<div class="card c5"><h3>Розподіл конкурсних балів</h3>'+
    '<div class="body">'+vBars(bkRows,{selKey:'bucket',w:440,h:184})+'</div>'+
    '<p class="note">Середній бал '+(A.avg?rf(A.avg):'—')+'. Клік по діапазону фільтрує весь звіт — у поточному рішенні цей зріз доступний лише через ручний фільтр зведеної таблиці.</p></div>'+

  '<div class="card c4"><h3>Пріоритет заяви</h3>'+
    '<div class="body">'+vBars(prRows,{selKey:'prior',w:340,h:170,color:'var(--teal)'})+'</div></div>'+

  '<div class="card c8"><h3>Структурний підрозділ × статус</h3><div class="body scroll"><table class="tbl">'+
    '<thead><tr><th>Підрозділ</th>'+topStatus.map(function(s){return '<th class="num" title="'+esc(s)+'">'+esc(s.length>13?s.slice(0,11)+'…':s)+'</th>';}).join('')+'<th class="num">Усього</th></tr></thead><tbody>'+
    matrixRows(matrixFac,topStatus)+
    '</tbody></table></div></div>'+

  '<div class="card c12"><h3>Заклад вищої освіти × структурний підрозділ <em>звідки прийшли бакалаври і куди подалися</em></h3>'+
    '<div class="body">'+univFacMatrix()+'</div>'+
    '<p class="note">Клік по рядку фільтрує звіт за ЗВО. Внутрішній потік КПІ проти зовнішнього — показник привабливості магістратури для випускників інших університетів.</p></div>';
}

function matrixRows(facs,statuses){
  var mask=rowMask('fac');
  var m={};
  for(var i=0;i<N;i++){
    if(!mask[i]) continue;
    var f=dims.fac[D.f[i]], s=dims.status[D.st[i]];
    (m[f]||(m[f]={}))[s]=((m[f]||{})[s]||0)+1;
    m[f].__t=(m[f].__t||0)+1;
  }
  return facs.map(function(f){
    var row=m[f]||{};
    var dim=(F.fac&&F.fac!==f)?' dim':'';
    return '<tr class="hit'+dim+'" data-filter="fac" data-value="'+esc(f)+'" tabindex="0"><td>'+esc(f)+'</td>'+
      statuses.map(function(s){return '<td class="num">'+nf(row[s]||0)+'</td>';}).join('')+
      '<td class="num" style="font-weight:600">'+nf(row.__t||0)+'</td></tr>';
  }).join('');
}

function renderDetail(A){
  if(role.aggOnly){
    return '<div class="card c12"><h3>Деталізація заяв</h3><div class="empty" style="padding:48px 20px">'+
      '<svg width="34" height="34" viewBox="0 0 24 24" style="opacity:.4"><rect x="4" y="10" width="16" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'+
      '<p style="margin:12px 0 4px;font-size:13px;color:var(--ink2)">Рядковий рівень недоступний для цієї ролі</p>'+
      '<p style="margin:0">Роль «'+esc(role.name)+'» бачить лише агреговані показники. Перемкніть роль у верхній панелі, щоб побачити, як працює Row-Level Security.</p></div></div>';
  }
  var mask=rowMask(), rows=[];
  for(var i=0;i<N && rows.length<400;i++){
    if(!mask[i]) continue;
    rows.push(i);
  }
  var total=0; for(var j=0;j<N;j++) if(mask[j]) total++;
  var pii=role.pii;

  var body=rows.map(function(i){
    var st=dims.status[D.st[i]];
    var cls = st==='До наказу'?'ok' : (st.indexOf('Відхилено')===0||st==='Відмова'?'no' : (st==='Деактивовано (зарахування)'?'n':'mid'));
    var code = 'ЗВ-' + String(200000+D.ap[i]*3+ (i%3)) ;
    return '<tr>'+
      '<td>'+(pii?esc(code):'<span class="mask">••••••</span>')+'</td>'+
      '<td>'+esc(dims.fac[D.f[i]])+'</td>'+
      '<td title="'+esc(dims.specName[D.sp[i]])+'">'+esc(dims.spec[D.sp[i]])+' '+esc(dims.specName[D.sp[i]].slice(0,26))+'</td>'+
      '<td>'+(D.fu[i]===0?'Бюджет':'Контракт')+'</td>'+
      '<td class="num">'+D.pr[i]+'</td>'+
      '<td class="num">'+(D.sc[i]>0?D.sc[i]:'—')+'</td>'+
      '<td>'+(dims.date[D.dt[i]]||'—').split('-').reverse().join('.')+'</td>'+
      '<td><span class="pill '+cls+'">'+esc(st)+'</span></td></tr>';
  }).join('');

  return '<div class="card c12"><h3>Деталізація заяв '+
    '<em>'+nf(total)+' рядків за фільтрами'+(total>400?' · показано перші 400':'')+
    (pii?'':' · персональні дані замасковані object-level security')+'</em></h3>'+
    '<div class="body scroll" style="max-height:520px"><table class="tbl"><thead><tr>'+
    '<th>Код заяви</th><th>Підрозділ</th><th>Спеціальність</th><th>Фінансування</th>'+
    '<th class="num">Пріор.</th><th class="num">Бал</th><th>Дата подання</th><th>Статус</th>'+
    '</tr></thead><tbody>'+(body||'<tr><td colspan="8" class="empty">Немає рядків за поточними фільтрами</td></tr>')+'</tbody></table></div>'+
    '<p class="note">У Power BI цей рівень реалізується через drillthrough зі сторінки «Огляд». Маскування полів — object-level security, налаштовується разом з RLS у Фазі 1.</p></div>';
}

/* ---------- Каркас UI ---------- */
function renderSlicers(){
  var facOpts = role.fac ? [role.fac] : dims.fac;
  var el=document.getElementById('slicers');
  el.innerHTML =
    '<div class="sl"><label>Тип конкурсної пропозиції</label><div class="seg" id="segFund">'+
      [['all','Усі'],['budget','Бюджет'],['contract','Контракт']].map(function(o){
        return '<button data-fund="'+o[0]+'" aria-pressed="'+(F.fund===o[0])+'">'+o[1]+'</button>';
      }).join('')+'</div></div>'+
    sl('fac','Структурний підрозділ',facOpts, role.fac?true:false)+
    sl('spec','Спеціальність',dims.spec.map(function(s,i){return [s,s+' · '+dims.specName[i]];}))+
    sl('status','Статус заявки',dims.status)+
    sl('form','Форма навчання',dims.form)+
    sl('prior','Пріоритет',[1,2,3,4,5,6,7].map(function(p){return [String(p),String(p)];}))+
    sl('bucket','Бал вступника',BUCKETS.map(function(b,i){return [String(i),b];}))+
    '<div class="sl"><label>&nbsp;</label><button class="clear" id="clearAll">Скинути фільтри</button></div>';

  el.querySelectorAll('select[data-dim]').forEach(function(s){
    s.addEventListener('change',function(){ F[s.dataset.dim]=s.value; render(); });
  });
  el.querySelectorAll('#segFund button').forEach(function(b){
    b.addEventListener('click',function(){ F.fund=b.dataset.fund; render(); });
  });
  var ca=document.getElementById('clearAll');
  var any = Object.keys(F).some(function(k){ return k==='fund'? F.fund!=='all' : F[k]!==''; });
  ca.disabled=!any;
  ca.addEventListener('click',function(){
    F={fund:'all',fac:'',spec:'',status:'',form:'',prior:'',bucket:'',univ:''}; render();
  });
}
function sl(dim,label,opts,locked){
  var cur=F[dim];
  var body=opts.map(function(o){
    var v=Array.isArray(o)?o[0]:o, t=Array.isArray(o)?o[1]:o;
    return '<option value="'+esc(v)+'"'+(String(cur)===String(v)?' selected':'')+'>'+esc(t.length>34?t.slice(0,32)+'…':t)+'</option>';
  }).join('');
  return '<div class="sl"><label>'+label+(locked?' · RLS':'')+'</label>'+
    '<select data-dim="'+dim+'"'+(locked?' disabled':'')+'>'+
    (locked?'':'<option value="">Усі</option>')+body+'</select></div>';
}

function renderXfilter(){
  var el=document.getElementById('xfilter'), tags=[];
  if(F.fund!=='all') tags.push(['fund', F.fund==='budget'?'Бюджет':'Контракт','Фінансування']);
  ['fac','spec','status','form','prior','bucket','univ'].forEach(function(k){
    if(F[k]==='') return;
    var v=F[k];
    if(k==='bucket') v=BUCKETS[+v];
    if(k==='spec') v=v+' · '+dims.specName[dims.spec.indexOf(v)];
    if(role.fac && k==='fac') return;
    tags.push([k, v, LABEL[k]]);
  });
  if(!tags.length){ el.innerHTML=''; return; }
  el.innerHTML='<span style="color:var(--ink2)">Активні фільтри:</span>'+tags.map(function(t){
    return '<span class="tag"><span style="color:var(--ink3)">'+esc(t[2])+':</span> '+
      esc(String(t[1]).length>32?String(t[1]).slice(0,30)+'…':t[1])+
      '<button data-drop="'+t[0]+'" aria-label="Зняти фільтр">&times;</button></span>';
  }).join('');
  el.querySelectorAll('button[data-drop]').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.drop; F[k] = (k==='fund')?'all':''; render();
    });
  });
}

function renderPages(){
  var el=document.getElementById('pages');
  el.innerHTML=PAGES.map(function(p){
    return '<button class="page-tab" role="tab" aria-selected="'+(page===p.id)+'" data-page="'+p.id+'">'+p.name+'</button>';
  }).join('');
  el.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){ page=b.dataset.page; render(); });
  });
}

function bindVisualClicks(){
  document.getElementById('canvas').querySelectorAll('[data-filter]').forEach(function(g){
    var act=function(){
      var k=g.dataset.filter, v=g.dataset.value;
      if(!k||k==='undefined') return;
      F[k] = (String(F[k])===String(v)) ? '' : v;
      render();
    };
    g.addEventListener('click',act);
    g.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();act();} });
  });
}

function render(){
  var A=agg(rowMask());
  renderPages(); renderSlicers(); renderXfilter();
  var c=document.getElementById('canvas');
  c.innerHTML = page==='overview'?renderOverview(A) : page==='compete'?renderCompete(A) : renderDetail(A);
  bindVisualClicks();
}

/* ---------- Ініціалізація ---------- */
var rsel=document.getElementById('role');
rsel.innerHTML=ROLES.map(function(r,i){return '<option value="'+i+'">'+esc(r.name)+'</option>';}).join('');
rsel.addEventListener('change',function(){
  role=ROLES[+rsel.value];
  F.fac = role.fac || '';
  if(role.aggOnly && page==='detail') page='overview';
  render();
});

render();
})();
</script>
</body>
</html>
